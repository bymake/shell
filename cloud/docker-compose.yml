# ShellPro 云同步后端 docker-compose
# 生产栈：API + MySQL + Redis（JWT 黑名单 / 会话缓存）
version: "3.9"

services:
  api:
    build: .
    container_name: shellpro-cloud-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SHELLPRO_API_ADDR: ":8080"
      SHELLPRO_JWT_SECRET: ${SHELLPRO_JWT_SECRET:-change-me-in-env}
      SHELLPRO_LICENSE_SECRET: ${SHELLPRO_LICENSE_SECRET:-change-me-in-env}
      DB_DSN: "shellpro:${DB_PASSWORD:-shellpro}@tcp(mysql:3306)/shellpro?parseTime=true&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8
    container_name: shellpro-cloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: shellpro
      MYSQL_USER: shellpro
      MYSQL_PASSWORD: ${DB_PASSWORD:-shellpro}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: shellpro-cloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql-data:
