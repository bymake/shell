# ShellPro packaging config (electron-builder)
appId: com.shellpro.app
productName: ShellPro
electronLanguages:
  - zh-CN
  - en-US
compression: maximum
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
asar: true
# Portable build: no native module rebuild (node:sqlite needs none; ssh2 is pure JS)
npmRebuild: false
asarUnpack:
  - "**/*.node"
win:
  target:
    # Portable build: single-file portable (no install) + dir (no install)
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: ShellPro
